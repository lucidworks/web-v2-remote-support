apiVersion: apps/v1
kind: Deployment
metadata:
  name: selenium-node-chrome
spec:
  replicas: 2
  selector:
    matchLabels:
      app: selenium-node-chrome
  template:
    metadata:
      labels:
        app: selenium-node-chrome
    spec:
      securityContext:
        fsGroup: 8764
        runAsUser: 8764
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
        - name: var-log
          emptyDir: {}
        - name: var-run
          emptyDir: {}
        - name: opt-selenium
          emptyDir: {}
        - name: home-fusion
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
      containers:
        - name: selenium-node-chrome
          image: lucidworks/fusion3p-selenium-node-chrome:4.38.0
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: node
              containerPort: 5555
              protocol: TCP
            - name: vnc
              containerPort: 7900
              protocol: TCP
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: var-log
              mountPath: /var/log
            - name: var-run
              mountPath: /var/run
            - name: opt-selenium
              mountPath: /opt/selenium
            - name: home-fusion
              mountPath: /home/fusion
            - name: dshm
              mountPath: /dev/shm
          env:
            - name: SE_EVENT_BUS_HOST
              value: selenium-hub
            - name: SE_EVENT_BUS_PUBLISH_PORT
              value: "4442"
            - name: SE_EVENT_BUS_SUBSCRIBE_PORT
              value: "4443"
            - name: SE_SESSION_TIMEOUT
              value: "60"
            - name: SE_NODE_SESSION_TIMEOUT
              value: "60"
            - name: SE_NODE_MAX_SESSIONS
              value: "1"
            - name: SE_NODE_OVERRIDE_MAX_SESSIONS
              value: "true"
            - name: SE_NODE_DRAIN_AFTER_SESSION_COUNT
              value: "200"
            - name: HOME
              value: /home/fusion
            - name: SE_NODE_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          livenessProbe:
            httpGet:
              path: /status
              port: 5555
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /status
              port: 5555
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
