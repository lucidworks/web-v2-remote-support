apiVersion: apps/v1
kind: Deployment
metadata:
  name: selenium-node-chrome
spec:
  replicas: 2
  selector:
    matchLabels:
      app: selenium-node-chrome
  template:
    metadata:
      labels:
        app: selenium-node-chrome
    spec:
      containers:
        - name: selenium-node-chrome
          image: lucidworks/fusion3p-selenium-node-chrome:4.38.0
          ports:
            - containerPort: 5555  # Node port
            - containerPort: 7900  # VNC port
          env:
            - name: SE_EVENT_BUS_HOST
              value: selenium-hub
            - name: SE_EVENT_BUS_PUBLISH_PORT
              value: "4442"
            - name: SE_EVENT_BUS_SUBSCRIBE_PORT
              value: "4443"
            - name: SE_NODE_MAX_SESSIONS
              value: "1"
            - name: SE_NODE_SESSION_TIMEOUT
              value: "60"
            - name: SE_SESSION_TIMEOUT
              value: "60"
            - name: SE_NODE_OVERRIDE_MAX_SESSIONS
              value: "true"
            - name: SE_NODE_DRAIN_AFTER_SESSION_COUNT
              value: "200"
            #- name: SE_VNC_NO_PASSWORD
            #  value: "1"
            #- name: SE_SCREEN_WIDTH
            #  value: "1920"
            #- name: SE_SCREEN_HEIGHT
            #  value: "1080"
            #- name: SE_SCREEN_DEPTH
            #  value: "24"
            - name: SE_NODE_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          livenessProbe:
            httpGet:
              path: /status
              port: 5555
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /status
              port: 5555
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "2000m"