version: '3'

services:
  selenium-hub:
    image: lucidworks/fusion3p-selenium-hub:4.38.0
    container_name: selenium-hub
    ports:
      - "4444:4444"
      - "4442:4442"
      - "4443:4443"
    security_opt:
      - no-new-privileges:true
    shm_size: 1g
    environment:
      - SE_GRID_BROWSER_TIMEOUT=300
      - SE_GRID_TIMEOUT=300
    networks:
      - selenium-grid
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/wd/hub/status"]
      interval: 5s
      timeout: 3s
      retries: 7
      start_period: 15s

  chrome-node-1:
    image: lucidworks/fusion3p-selenium-node-chrome:4.38.0
    container_name: chrome-node-1
    shm_size: 2g
    depends_on:
      - selenium-hub
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /opt/selenium:uid=8764,gid=8764,exec
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_PUBLISH_EVENT_BUS_URL=tcp://selenium-hub:4442
      - SE_SUBSCRIBE_EVENT_BUS_URL=tcp://selenium-hub:4443
      - SE_NODE_MAX_SESSIONS=4
      - SE_NODE_SESSION_TIMEOUT=60
      - HOME=/home/seluser
      - SE_NODE_GRID_URL=http://selenium-hub:4444
    networks:
      - selenium-grid
    restart: always

  chrome-node-2:
    image: lucidworks/fusion3p-selenium-node-chrome:4.38.0
    container_name: chrome-node-2
    shm_size: 2g
    depends_on:
      - selenium-hub
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /opt/selenium:uid=8764,gid=8764,exec
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_PUBLISH_EVENT_BUS_URL=tcp://selenium-hub:4442
      - SE_SUBSCRIBE_EVENT_BUS_URL=tcp://selenium-hub:4443
      - SE_NODE_MAX_SESSIONS=4
      - SE_NODE_SESSION_TIMEOUT=60
      - HOME=/home/seluser
      - SE_NODE_GRID_URL=http://selenium-hub:4444
    networks:
      - selenium-grid
    restart: always

  lucidworks-connector:
    image: eclipse-temurin:17-jdk-jammy
    container_name: lucidworks-remote-connector
    working_dir: /app
    command: >
      sh -c "if [ ! -f /app/bin/connector-plugin-standalone-*.jar ] || [ ! -f /app/bin/lucidworks.connector.*.zip ]; then
             echo 'ERROR: Required files connector-plugin-standalone jar or lucidworks.connector.web zip are missing';
             echo 'Please download them from Lucidworks support and place them in the bin directory';
             sleep infinity;
             else
             cp /app/bin/lucidworks.connector.web-v2-*.zip /app/connector-plugin.zip &&
             java -Dlogging.config=/app/bin/conf/logback.xml -jar /app/bin/connector-plugin-standalone-*.jar /app/bin/conf/connector-config.yaml;
             fi"
    restart: unless-stopped
    environment:
      - TZ=UTC
    ports:
      - "8764:8764"
    volumes:
      - ./bin:/app/bin
    networks:
      - selenium-grid

networks:
  selenium-grid: